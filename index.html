<script>
// ==========================================
// 1. SUPABASE INITIALIZATION
// ==========================================
const SUPABASE_URL = 'https://ktcvwmjjnxdamzecfaxq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BCjwtGD7bSzQNjVyc6czTg_974UL0z-';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Active Session Variables
let currentShopId = null;
let currentUser = null;

// ==========================================
// 2. CORE CLOUD FUNCTIONS (Replaces localStorage)
// ==========================================

// Load Inventory Items for Current Shop
async function loadItems() {
  if (!currentShopId) return [];
  const { data, error } = await supabaseClient
    .from('items')
    .select('*')
    .eq('shop_id', currentShopId);
  
  if (error) {
    console.error('Error loading items:', error);
    return [];
  }
  return data || [];
}

// Save / Add a New Inventory Item
async function saveItem(itemData) {
  if (!currentShopId) return;
  const { error } = await supabaseClient
    .from('items')
    .insert([{ 
      shop_id: currentShopId,
      name: itemData.name,
      unit: itemData.unit || 'piece',
      cost: itemData.cost || 0,
      price: itemData.price || 0,
      qty: itemData.qty || 0,
      reorder_qty: itemData.reorderQty || 5,
      expiry_date: itemData.expiryDate || null,
      batch_no: itemData.batchNo || null,
      barcode: itemData.barcode || null
    }]);
    
  if (error) {
    console.error('Error saving item:', error);
    alert('Failed to save item to cloud.');
  }
}

// Record a Completed Sale
async function recordSale(saleData) {
  if (!currentShopId) return;
  const { error } = await supabaseClient
    .from('sales')
    .insert([{ 
      shop_id: currentShopId, 
      user_id: currentUser ? currentUser.id : null,
      total: saleData.total,
      payment_method: saleData.paymentMethod,
      bank: saleData.bank || null,
      customer_name: saleData.customerName || null,
      cash_given: saleData.cashGiven || 0,
      is_late: saleData.isLate || false,
      sale_data: saleData.items
    }]);

  if (error) {
    console.error('Error recording sale:', error);
    alert('Failed to record sale to cloud.');
  }
}

// Register a New Shop & Initial Owner Account
async function registerShopAndOwner(shopName, ownerName, ownerPhone, ownerPin) {
  const { data: shopData, error: shopError } = await supabaseClient
    .from('shops')
    .insert([{ name: shopName, plan: 'trial' }])
    .select()
    .single();

  if (shopError) {
    console.error('Error creating shop:', shopError);
    alert('Shop registration failed.');
    return null;
  }

  const newShopId = shopData.id;

  const { data: userData, error: userError } = await supabaseClient
    .from('users')
    .insert([{
      shop_id: newShopId,
      name: ownerName,
      phone: ownerPhone,
      role: 'owner',
      pin: ownerPin,
      is_active: true
    }])
    .select()
    .single();

  if (userError) {
    console.error('Error creating owner user:', userError);
    alert('Failed to create admin user.');
    return null;
  }

  currentShopId = newShopId;
  currentUser = userData;
  return { shop: shopData, user: userData };
}
</script>
