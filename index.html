function add(id){const it=S.items.find(i=>i.id==id),l=cart.find(x=>x.id==id);if(l){if(l.q<it.qty)l.q++}else if(it.qty>0)cart.push({id,n:it.n,q:1,p:it.price,c:it.cost});cartV()}
function qty(k,d){const l=cart[k],it=S.items.find(i=>i.id==l.id),n=l.q+d;if(n<1)cart.splice(k,1);else if(n<=it.qty)l.q=n;cartV()}

+`<div class=tot>${T('Total')}: ${money(tot)}</div><div class=row>${[['cash','Cash'],['mob','Mobile'],['mix','Mixed'],['cr','Credit']].map(a=>`<button class="bt ${m==a[0]?'on':''}" onclick="pm('${a[0]}')">${T(a[1])}</button>`).join('')}</div>`
+(mm?`<select onchange="pay.b=this.value"><option value="">— ${T('Select bank')} —</option>${BK.map(b=>`<option ${b==pay.b?'selected':''}>${b}</option>`).join('')}</select>`:'')
+(m=='mix'?`<input class=in type=number placeholder="${T('Cash part')}" value="${pay.c||''}" onchange="pay.c=+this.value;cartV()"><p class=mu>${T('Mobile')}: ${money(Math.max(0,tot-pay.c))}</p>`:'')
+(m=='cr'?`<input class=in placeholder="${T('Customer name')}" value="${pay.cust}" onchange="pay.cust=this.value">`:'')
+(mm?`<label class=lb>💵 ${T('Cash given to customer')}</label><input class=in type=number min=0 placeholder="0" value="${pay.co||''}" onchange="pay.co=Math.max(0,+this.value||0);cartV()">`+(pay.co>0?`<p class=mu>${T('Cash')} −${money(pay.co)} · ${T('Mobile')} +${money(pay.co)}</p>`:''):'')
+`<button class=bp onclick=done()>✔ ${T('Complete')}</button><div id=msg></div>`}
